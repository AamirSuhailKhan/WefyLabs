name: CI Pipeline

on:
  push:
    branches: [ main, level-1 ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    name: Test FastAPI Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadscore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          cd apps/api
          poetry install --no-interaction --no-root

      # ── Phase 0 P0.6: secret scan FAILS CI. The previous step swallowed the
      # exit code with '|| true', so committed secrets never failed the build.
      - name: ── SECRET SCAN ── Detect accidental secret commits
        run: |
          cd apps/api
          poetry run pip install detect-secrets --quiet
          if [ -f .secrets.baseline ]; then
            poetry run detect-secrets scan --baseline .secrets.baseline .
          else
            poetry run detect-secrets scan --list-all-plugins .
          fi

      - name: ── MIGRATION INTEGRITY ── Verify single Alembic head
        env:
          ENV: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/leadscore_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_super_secret_jwt_key_ci_environment_32chars
          SUPABASE_JWT_SECRET: supabase_jwt_secret_test_placeholder_for_ci_only
        run: |
          cd apps/api
          echo "[CI] Checking Alembic migration head consistency..."
          HEAD_COUNT=$(poetry run python -m alembic heads 2>/dev/null | grep "(head)" | wc -l)
          echo "[CI] Alembic heads found: ${HEAD_COUNT}"
          if [ "${HEAD_COUNT}" -gt 1 ]; then
            echo "[FAIL] Multiple Alembic heads detected! Run 'alembic merge' to resolve."
            exit 1
          fi
          echo "[OK] Single Alembic head confirmed."

      - name: Run Pytest Suite
        env:
          ENV: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/leadscore_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_super_secret_jwt_key_ci_environment_32chars
          SUPABASE_JWT_SECRET: supabase_jwt_secret_test_placeholder_for_ci_only
          OPENAI_API_KEY: sk-placeholder
          DIALOG360_API_KEY: d360_key_placeholder
          RAZORPAY_KEY_ID: rzp_test_placeholder
          RAZORPAY_KEY_SECRET: secret_placeholder
        run: |
          cd apps/api
          poetry run pytest -v --tb=short

  lint:
    name: Linting & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff + Bandit
        run: pip install ruff bandit

      - name: Run Python Linter (Ruff)
        run: ruff check apps/api

      # ── Phase 0 P0.6: Bandit findings FAIL CI (no error suppression).
      - name: ── SECURITY SCAN ── Bandit Static Analysis
        run: |
          bandit -r apps/api/app -ll -ii -x apps/api/app/tests,apps/api/tests

  frontend:
    name: Frontend Security & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm ci

      - name: ── SECURITY SCAN ── npm audit (fail on critical)
        run: |
          cd apps/web
          npm audit --audit-level=critical

      - name: TypeScript Check
        run: |
          cd apps/web
          npx tsc --noEmit

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-api, lint, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image (Production)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.prod
          push: false
          tags: wefylabs-api:latest

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: wefylabs-web:latest
