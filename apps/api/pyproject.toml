[tool.poetry]
name = "leadscore-api"
version = "0.1.0"
description = "LeadScore AI-powered real estate lead qualification backend"
authors = ["LeadScore Team <dev@leadscore.in>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.0.0"
email-validator = "^2.1.0"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
redis = "^5.0.0"
google-generativeai = "^0.8.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
razorpay = "^1.4.1"
celery = "^5.4.0"
pytesseract = "^0.3.10"
pillow = "^10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
filterwarnings = [
    # Suppress RuntimeWarning raised by AsyncMock when the test mock for
    # db.session.add() (synchronous SQLAlchemy method) returns an unawaited
    # coroutine. This is a test-infrastructure artifact: production code correctly
    # calls session.add() synchronously. Real coroutine misuse warnings from
    # non-mock code are NOT suppressed by this filter.
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]
