version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: leadscore_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadscore_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/leadscore
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - DIALOG360_API_KEY=${DIALOG360_API_KEY:-d360_key_placeholder}
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadscore_celery_worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    environment:
      - ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/leadscore
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - DIALOG360_API_KEY=${DIALOG360_API_KEY:-d360_key_placeholder}
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadscore_celery_beat
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    environment:
      - ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/leadscore
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - DIALOG360_API_KEY=${DIALOG360_API_KEY:-d360_key_placeholder}
    depends_on:
      redis:
        condition: service_healthy
